<div class="auth-page">
  <div class="auth-card">
    <!-- Card Header -->
    <div class="auth-card-header">
      <div class="auth-logo">
        <i class="fa-solid fa-bolt"></i>
      </div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your Digitic account</p>
    </div>

    <!-- Form -->
    <div class="auth-card-body">
      <form [formGroup]="logForm" (ngSubmit)="login()">

        <!-- Email -->
        <div class="form-group">
          <label class="form-label">
            <i class="fa-regular fa-envelope"></i> Email Address
          </label>
          <input
            formControlName="email"
            class="form-input"
            [class.is-invalid]="logForm.get('email')?.invalid && logForm.get('email')?.touched"
            placeholder="you@example.com"
            type="email"
          >
          <div class="validation-msg" *ngIf="logForm.get('email')?.invalid && logForm.get('email')?.touched">
            <span *ngIf="logForm.get('email')?.getError('required')">
              <i class="fa-solid fa-circle-exclamation"></i> Email is required
            </span>
            <span *ngIf="logForm.get('email')?.getError('email')">
              <i class="fa-solid fa-circle-exclamation"></i> Please enter a valid email
            </span>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label">
            <i class="fa-solid fa-lock"></i> Password
          </label>
          <input
            formControlName="password"
            class="form-input"
            [class.is-invalid]="logForm.get('password')?.invalid && logForm.get('password')?.touched"
            placeholder="••••••••"
            type="password"
          >
          <div class="validation-msg" *ngIf="logForm.get('password')?.invalid && logForm.get('password')?.touched">
            <span *ngIf="logForm.get('password')?.getError('required')">
              <i class="fa-solid fa-circle-exclamation"></i> Password is required
            </span>
            <span *ngIf="logForm.get('password')?.getError('pattern')">
              <i class="fa-solid fa-circle-exclamation"></i> Min 8 chars with uppercase, lowercase, number & special char
            </span>
          </div>
        </div>

        <!-- Submit -->
        <button class="auth-submit-btn" type="submit" [disabled]="logForm.invalid">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In
        </button>
      </form>

      <!-- Footer Link -->
      <p class="auth-footer-link">
        Don't have an account? <a routerLink="/register">Create one</a>
      </p>
    </div>
  </div>
</div>
