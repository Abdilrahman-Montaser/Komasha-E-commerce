<app-slider [pros]="pros"></app-slider>

<section class="products-section">
  <div class="container">

    <!-- Search Bar -->
    <div class="search-wrapper">
      <i class="fa-solid fa-magnifying-glass search-icon-inner"></i>
      <input
        type="text"
        placeholder="Search products by name..."
        class="products-search-input"
        [(ngModel)]="searchTerm"
      >
    </div>

    <!-- Section Heading -->
    <div class="section-heading">
      <div class="heading-left">
        <span class="heading-badge">🛍️ New Arrivals</span>
        <h2 class="heading-title">Featured Collection</h2>
      </div>
      <div class="heading-nav">
        <button class="nav-arrow"><i class="fa-solid fa-angle-left"></i></button>
        <button class="nav-arrow"><i class="fa-solid fa-angle-right"></i></button>
      </div>
    </div>

    <!-- Product Grid -->
    <div class="products-grid">
      <div class="product-col" *ngFor="let pro of pros | search: searchTerm">
        <app-product [product]="pro"></app-product>
      </div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="(pros | search: searchTerm).length === 0 && pros.length > 0">
      <i class="fa-solid fa-box-open"></i>
      <p>No products match your search.</p>
    </div>

  </div>
</section>
