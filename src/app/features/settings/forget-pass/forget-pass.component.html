<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card-header" style="background: linear-gradient(135deg, #0ea5e9, #4F46E5);">
      <div class="auth-logo">
        <i class="fa-solid fa-key"></i>
      </div>
      <h1 class="auth-title">Forgot Password?</h1>
      <p class="auth-subtitle">Enter your email and we'll send you a reset link</p>
    </div>
    <div class="auth-card-body">
      <div class="form-group">
        <label class="form-label">
          <i class="fa-regular fa-envelope"></i> Email Address
        </label>
        <input class="form-input" type="email" placeholder="you@example.com">
      </div>
      <button class="auth-submit-btn" style="background: linear-gradient(135deg, #0ea5e9, #4F46E5);">
        <i class="fa-solid fa-paper-plane"></i> Send Reset Link
      </button>
      <p class="auth-footer-link">
        Remember your password? <a routerLink="/login">Sign in</a>
      </p>
    </div>
  </div>
</div>
