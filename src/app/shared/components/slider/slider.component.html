<section class="slider-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col" *ngIf="pros.length > 0">
        <owl-carousel-o *ngIf="showCarousel" [options]="customOptions">
          <ng-template *ngFor="let pro of pros" carouselSlide>
            <div class="slider-item-wrapper">
              <app-product [product]="pro"></app-product>
            </div>
          </ng-template>
        </owl-carousel-o>
      </div>
    </div>
  </div>
</section>
